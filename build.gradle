plugins {
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // 默认 Maven 仓库。如需在此处添加新的仓库，请在此添加。
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/central/' }
}

dependencies {
    // 要修改 Minecraft 版本，请修改 gradle.properties 中的 minecraft_version / yarn_mappings。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // ── Fabric API（编译期）─────────────────────────────────────────
    // 用 modCompileOnly 逐个引入所需模块：只做编译期依赖、不打进 jar、不触发
    // Loom 的 javadoc 命名空间校验。注意：不要加入 fabric-content-registries-v0，
    // 它自带的 javadoc 会触发 "must be have an intermediary source namespace" 报错。
    // 运行时仍要求玩家安装完整的 Fabric API（见 fabric.mod.json 的 depends）。
    modCompileOnly "net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.6.15+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-networking-api-v1:5.1.5+ae1e07683e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-object-builder-api-v1:21.1.38+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-item-api-v1:11.5.20+d0c46b9e3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-renderer-api-v1:8.0.0+f4ffd2e53e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-command-api-v2:2.4.7+6b42a6003e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-entity-events-v1:3.0.5+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-registry-sync-v0:6.2.4+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-particles-v1:4.2.11+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-dimensions-v1:4.0.28+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-game-rule-api-v1:2.0.3+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-loot-api-v3:2.0.20+78c8b4663e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-recipe-api-v1:8.2.3+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-biome-api-v1:17.1.1+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-screen-api-v1:3.1.7+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-tag-api-v1:1.2.20+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-block-api-v1:1.1.10+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api-lookup-api-v1:1.6.113+1fb1cde93e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-data-attachment-api-v1:1.8.43+1fb1cde93e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:1.0.10+78c8b4663e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-message-api-v1:6.1.12+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-crash-report-info-v1:0.3.23+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-rendering-v1:16.2.7+f4ffd2e53e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-rendering-fluids-v1:3.1.43+4ebb5c083e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-sound-api-v1:1.0.51+4fc5413f3e"
    modCompileOnly "net.fabricmc.fabric-api:fabric-resource-conditions-api-v1:5.0.35+4fc5413f3e"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom 会自动附加 sourcesJar 到 build 流程。
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 配置 Maven 发布。
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
